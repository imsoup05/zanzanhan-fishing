<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>디버그</title>
<style>
  html, body { margin: 0; padding: 0; background: #ff00ff; }
  #box {
    position: fixed;
    inset: 0;
    background: #05141a;
    color: #f4f8f6;
    font-family: monospace;
    font-size: 15px;
    line-height: 1.7;
    padding: 20px;
    white-space: pre-wrap;
    overflow-y: auto;
    box-sizing: border-box;
    border: 4px solid #3aa0d8;
  }
  .safe-probe {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    padding-top: env(safe-area-inset-top, -1px);
    padding-bottom: env(safe-area-inset-bottom, -1px);
    padding-left: env(safe-area-inset-left, -1px);
    padding-right: env(safe-area-inset-right, -1px);
    pointer-events: none;
    visibility: hidden;
  }
</style>
</head>
<body>
<div class="safe-probe" id="probe"></div>
<div id="box">측정 중...</div>
<script>
  function val(x) { return x === undefined || x === null ? 'undefined' : x; }
  function report() {
    const probe = document.getElementById('probe');
    const cs = getComputedStyle(probe);
    const vv = window.visualViewport;
    const lines = [
      '=== 화면/뷰포트 ===',
      'window.innerWidth/Height: ' + window.innerWidth + ' x ' + window.innerHeight,
      'documentElement.clientWidth/Height: ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
      'screen.width/height: ' + screen.width + ' x ' + screen.height,
      'devicePixelRatio: ' + window.devicePixelRatio,
      'visualViewport.width/height: ' + (vv ? vv.width + ' x ' + vv.height : 'N/A'),
      'visualViewport.offsetTop/Left: ' + (vv ? vv.offsetTop + ' / ' + vv.offsetLeft : 'N/A'),
      '',
      '=== safe-area-inset (env()) ===',
      'top: ' + cs.paddingTop,
      'bottom: ' + cs.paddingBottom,
      'left: ' + cs.paddingLeft,
      'right: ' + cs.paddingRight,
      '',
      '=== 실행 모드 ===',
      'display-mode standalone: ' + window.matchMedia('(display-mode: standalone)').matches,
      'navigator.standalone: ' + val(window.navigator.standalone),
      '',
      '=== #box (position:fixed; inset:0) 실측 ===',
    ];
    const boxRect = document.getElementById('box').getBoundingClientRect();
    lines.push('top/left/width/height: ' + boxRect.top + ' / ' + boxRect.left + ' / ' + boxRect.width + ' / ' + boxRect.height);
    lines.push('');
    lines.push('*** 이 화면을 캡처(스크린샷)해서 보내주세요 ***');
    lines.push('(파란 테두리가 어디서 끝나는지도 같이 봐주세요 - 화면 끝까지 닿는지, 검은 여백이 파란 테두리 안쪽인지 바깥쪽인지)');
    document.getElementById('box').textContent = lines.join('\n');
  }
  report();
  window.addEventListener('resize', report);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', report);
  setTimeout(report, 300);
  setTimeout(report, 1000);
</script>
</body>
</html>
