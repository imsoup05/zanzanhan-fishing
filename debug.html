<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>디버그</title>
<meta name="theme-color" content="#0f4b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="낚시터">
<style>
  html, body { margin: 0; padding: 0; background: #ff00ff; }
  #box {
    position: fixed;
    inset: 0;
    background: #05141a;
    color: #f4f8f6;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 14px;
    white-space: pre-wrap;
    overflow-y: auto;
    box-sizing: border-box;
    border: 4px solid #3aa0d8;
  }
  .safe-probe {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    padding-top: env(safe-area-inset-top, -1px);
    padding-bottom: env(safe-area-inset-bottom, -1px);
    padding-left: env(safe-area-inset-left, -1px);
    padding-right: env(safe-area-inset-right, -1px);
    pointer-events: none;
    visibility: hidden;
  }
  #topedge {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 30px;
    background: #ff5a4a;
    color: #fff;
    font-family: monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #botedge {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: #6fcf7a;
    color: #05141a;
    font-family: monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="safe-probe" id="probe"></div>
<div id="box">측정 중...</div>
<div id="topedge">▲ TOP EDGE (여기가 화면 맨 위와 붙어야 정상) ▲</div>
<div id="botedge">▼ BOTTOM EDGE (여기가 화면 맨 아래와 붙어야 정상) ▼</div>
<script>
  function val(x) { return x === undefined || x === null ? 'undefined' : x; }
  function report() {
    const probe = document.getElementById('probe');
    const cs = getComputedStyle(probe);
    const vv = window.visualViewport;
    const lines = [
      '=== 화면/뷰포트 ===',
      'innerWidth/Height: ' + window.innerWidth + ' x ' + window.innerHeight,
      'clientWidth/Height: ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
      'screen.width/height: ' + screen.width + ' x ' + screen.height,
      'dPR: ' + window.devicePixelRatio,
      'visualViewport w/h: ' + (vv ? vv.width + ' x ' + vv.height : 'N/A'),
      '',
      '=== safe-area-inset ===',
      'top/bottom/left/right: ' + cs.paddingTop + ' / ' + cs.paddingBottom + ' / ' + cs.paddingLeft + ' / ' + cs.paddingRight,
      '',
      '=== 실행 모드 ===',
      'display-mode standalone: ' + window.matchMedia('(display-mode: standalone)').matches,
      'navigator.standalone: ' + val(window.navigator.standalone),
      '',
      '빨강 막대와 초록 막대가 화면 위/아래 끝에',
      '딱 붙어있는지 스크린샷으로 확인해주세요.',
      '마젠타색이 조금이라도 보이면 그만큼이 안 채워진 것입니다.',
    ];
    document.getElementById('box').textContent = lines.join('\n');
  }
  report();
  window.addEventListener('resize', report);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', report);
  setTimeout(report, 300);
  setTimeout(report, 1000);
</script>
</body>
</html>
