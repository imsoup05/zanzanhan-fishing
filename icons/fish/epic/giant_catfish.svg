<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <!-- Blunt, oversized head instead of the shared lens-body template;
       a catfish that "shouldn't exist at this size" reads as a huge flat
       head with a stubby tail, not a normal fish silhouette. -->
  <path d="M2 16C2 8.5 11 5.5 19 5.5C27 5.5 30.5 10 30.5 16C30.5 22 27 26.5 19 26.5C11 26.5 2 23.5 2 16Z" fill="#813d8f"/>
  <path d="M30 16L39 10.5L36 16L39 21.5Z" fill="#67306f"/>
  <!-- Long trailing barbels, thicker near the mouth. -->
  <path d="M7 19.5Q0 23 -3 29" stroke="#34183a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M6 18Q-2 19 -6 21.5" stroke="#34183a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M8 13.5Q3 8 0.5 3.5" stroke="#34183a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M6 16.5C10 19.5 15 19.5 18 17.5" stroke="#34183a" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="12.5" cy="11.5" r="1.7" fill="#0a1a1e"/>
</svg>
