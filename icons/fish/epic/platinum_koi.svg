<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <!-- Koi are defined by their oversized, flowing fan-tail more than their
       (fairly ordinary) body; give that the visual weight instead of
       reusing the shared kite-tail template. -->
  <path d="M29 16C33 8 42 5.5 46.5 8C41.5 10.5 38.5 13.5 37.5 16C38.5 18.5 41.5 21.5 46.5 24C42 26.5 33 24 29 16Z" fill="#dcd7e6" opacity="0.9"/>
  <path d="M28.5 16C31.5 10.5 38 9 41.5 10.5C37.5 12.5 35.5 14.5 35 16C35.5 17.5 37.5 19.5 41.5 21.5C38 23 31.5 21.5 28.5 16Z" fill="#b4adc2"/>
  <path d="M4 16C6 10.5 14 8.5 21 8.5C26.5 8.5 29.5 11.5 29.5 16C29.5 20.5 26.5 23.5 21 23.5C14 23.5 6 21.5 4 16Z" fill="#b4adc2"/>
  <!-- Platinum shine streak. -->
  <path d="M9 11.5C13 10 19 10 24 12" stroke="#f4f2f8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <!-- Scale hinting, not full coverage. -->
  <path d="M13 18q2 1.4 4 0M19 19q2 1.4 4 0" stroke="#8f87a3" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Long, soft flowing barbels (koi have these, thinner than a catfish's). -->
  <path d="M7.5 18.5q-4 3.5 -7 4" stroke="#463e55" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M7.5 15.5q-4 -2 -7 -2.2" stroke="#463e55" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="10.8" cy="13.3" r="1.75" fill="#0a1a1e"/>
  <circle cx="11.2" cy="12.8" r="0.5" fill="#fff" opacity="0.85"/>
</svg>
