<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <!-- Soft glow halo, larger and warmer than abyssal_angler's, since this
       fish's whole body glows rather than one lure-tip. -->
  <circle cx="17" cy="16" r="16" fill="#ffe9fb" fill-opacity="0.28"/>
  <circle cx="17" cy="16" r="11" fill="#fff" fill-opacity="0.18"/>
  <!-- Slim, streamlined ayu body; noticeably slighter than the other
       templates (real ayu are slender river fish), not just recolored. -->
  <path d="M4 16C6 12 15 10 23 10C28 10 31 12.6 31 16C31 19.4 28 22 23 22C15 22 6 20 4 16Z" fill="#e6b8ee"/>
  <path d="M30 16L40 12L36 16L40 20Z" fill="#d79fe3"/>
  <path d="M12.5 12.6q3 -4.4 6.4 -0.9" stroke="#8a4f96" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Light sparkles drifting off the body. -->
  <path d="M35 8l0.55 1.4l1.4 0.55l-1.4 0.55l-0.55 1.4l-0.55-1.4l-1.4-0.55l1.4-0.55z" fill="#fff" opacity="0.9"/>
  <path d="M20 5.5l0.4 1l1 0.4l-1 0.4l-0.4 1l-0.4-1l-1-0.4l1-0.4z" fill="#fff" opacity="0.75"/>
  <circle cx="9.3" cy="14.4" r="1.6" fill="#3a1f42"/>
  <circle cx="9.6" cy="14" r="0.45" fill="#fff" opacity="0.9"/>
</svg>
