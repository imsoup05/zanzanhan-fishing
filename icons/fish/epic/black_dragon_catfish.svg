<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <!-- Wide catfish head (bigger/flatter than the shared template, though
       not as extreme as giant_catfish) so the horn-whiskers have a "brow"
       to sweep back from. -->
  <path d="M3 16C3 9 12 6.5 19.5 6.5C27 6.5 31 10.5 31 16C31 21.5 27 25.5 19.5 25.5C12 25.5 3 23 3 16Z" fill="#241131"/>
  <path d="M30.5 16L39 11L36 16L39 21Z" fill="#1a0c24"/>
  <!-- Horn-like whiskers: thick tapering shapes swept back over the head,
       not thin dangling lines; this is the whole point of 흑룡메기. -->
  <path d="M9 12.5C7 8 8.5 3.5 12.5 1C11 5 11.5 8.6 13.5 11.6Z" fill="#a88a5a"/>
  <path d="M12.5 13.5C11.5 8.6 13.8 4.4 18 2.4C16 6.4 16.3 10 18 13.2Z" fill="#c9ab77"/>
  <!-- Small dragon-ish spike ridge along the back. -->
  <path d="M17 8.2l1.6-3l0.6 3.2M22 7l1.6-2.8l0.5 3.1" stroke="#a88a5a" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ordinary lower barbels stay thin, for contrast against the horns. -->
  <path d="M6.5 19Q0 22 -3 26.5" stroke="#0d0714" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <circle cx="11.5" cy="12.8" r="1.7" fill="#c9403a"/>
  <circle cx="11.5" cy="12.8" r="0.75" fill="#1a0c24"/>
</svg>
