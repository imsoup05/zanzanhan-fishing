<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <path d="M2 23C3 14 6 7 11 8C15 9 15 20 19 20C23 20 22 6 28 7C33 8 34 14 38 12
           L38 19C34 21 33 25 28 24C22 23 23 10 19 10C15 10 15 21 11 21C6 20 3 18 2 23Z"
        fill="#f0a824"/>
  <path d="M11 8C15 9 15 20 19 20C23 20 22 6 28 7C29.2 7.15 30.2 7.5 31 8.05
           C25.6 8.4 26 20 20 20C16 20 16 9.5 12 9C11.6 8.95 11.3 8.95 11 9Z"
        fill="#ffe08a" opacity="0.85"/>
  <!-- Whiskers stream backward over the neck, like classic imugi/dragon art;
       drawn before the head so the head's edge overlaps their base. -->
  <path d="M43 15.6C38 15 33 17.4 27 16.6" stroke="#c97e12" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M42.4 17.4C37.6 18.4 32.4 19.4 26.6 19.6" stroke="#ffe9b8" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Head: rounder crown, tapering jaw/snout instead of a plain circle. -->
  <path d="M35.6 13.4C35.6 9.2 39 6 43.4 6.4C47 6.7 48.5 9.6 47.6 12.4
           C49.4 13 49.6 15 47.4 15.4C48 17.6 45.8 19.2 43.4 18.4
           C40.6 20.6 35.8 19 35.4 15Z" fill="#f0a824"/>
  <!-- Single horn sweeping back off the crown. -->
  <path d="M41.6 6.6C41.2 4 42 1.4 44 0C43.6 2.6 44.4 4.6 45.8 6.2
           C44.2 5.6 42.8 5.8 41.6 6.6Z" fill="#c97e12"/>
  <!-- Brow ridge, gives the eye somewhere to sit instead of floating. -->
  <path d="M39 8.2q3-2 6.2-1" stroke="#c97e12" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="43.4" cy="10.4" r="1.35" fill="#241405"/>
  <circle cx="43.75" cy="9.95" r="0.42" fill="#fff" opacity="0.9"/>
</svg>
