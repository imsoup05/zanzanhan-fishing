<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <defs>
    <!-- 이무기 are traditionally blue/azure serpent-dragons, not gold;
         gold is this game's LEGENDARY TIER color (badge/glow), which is a
         separate concept from what color the creature itself is. Kept the
         gold as an accent (horns/mane/whiskers/aura) so the tier read stays
         intact, but the body itself is blue. -->
    <linearGradient id="imugiBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff4fb"/>
      <stop offset="45%" stop-color="#4fa9d9"/>
      <stop offset="100%" stop-color="#173f66"/>
    </linearGradient>
    <linearGradient id="imugiHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdeaf8"/>
      <stop offset="100%" stop-color="#2c7aab"/>
    </linearGradient>
    <radialGradient id="imugiEye" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#ffcf4d"/>
      <stop offset="55%" stop-color="#e8580a"/>
      <stop offset="100%" stop-color="#3a1204"/>
    </radialGradient>
  </defs>

  <!-- The whole drawing's rightmost points (snout tip, horn tips) reached
       x~50, past this viewBox's own width of 48; every fish icon in this
       set uses the same 0 0 48 32 viewBox, so widening it here would make
       imugi render at a different scale than its siblings wherever they're
       shown together (도감 grid, etc). Scaling the whole group down instead
       keeps that consistent and guarantees nothing can clip regardless of
       exactly where a future edit pushes a coordinate.
       The negative x scale mirrors the drawing: it was drawn facing right,
       while every other fish icon in the set faces left. -->
  <g transform="translate(48 0) scale(-0.94 0.94)">
  <!-- Legendary aura -->
  <ellipse cx="26" cy="16" rx="23" ry="15" fill="#ffcf6b" opacity="0.16"/>
  <ellipse cx="31" cy="10" rx="13" ry="9" fill="#ffe9b0" opacity="0.22"/>

  <!-- Whiskers stream backward over the neck, drawn first so the head's
       edge overlaps their base; flowing WITH the body's motion instead
       of crossing flat over it. -->
  <path d="M40.5 15.4C35 14.6 29.5 15.8 24.5 18.2" stroke="#d4a017" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M41.2 12.6C35.6 11.4 29.8 11.9 24.3 14.4" stroke="#ffe9b0" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- One continuous body: tapers from a thin tail through a confident
       S-curve into the neck, widening the whole way so there's no seam
       where a thin ribbon meets the head. -->
  <path d="M2 25C3.5 20 6 16.8 8 17.2C9.8 14 12 11 14.5 9.2
           C17 7.4 19.8 6.1 22.5 5.6C25.5 5 28.5 5.2 31 6.4
           C33.8 7.7 36 9.8 38.5 10.4
           C39.6 8.7 40.8 8 41.8 8.4C42.7 8.8 42.6 10.4 41.5 11.6
           C42.4 12.2 42.6 13.3 41.7 14
           C42.6 14.7 42.5 15.9 41.3 16.4C39.6 17.1 37.5 16.2 36 14.8
           C33.2 15.4 30.5 15.2 28 14
           C25 12.5 22.5 11.7 20 12.4C17.7 13 15.8 15.5 14 17.8
           C12 20.3 9.8 22.6 8 23.4C6 24.3 3.8 24.8 2 25Z"
        fill="url(#imugiBody)"/>

  <!-- Spine highlight along the top edge; bolder, follows the S all the way through. -->
  <path d="M8.5 17.6C10.2 14.4 12.3 11.6 14.8 9.7C17.3 7.8 20 6.5 22.6 6
           C25.4 5.4 28.2 5.6 30.6 6.7C33.2 7.9 35.3 9.8 37.6 10.6"
        stroke="#eefaff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Belly-side shadow band for a rounder, less flat body. -->
  <path d="M9 22.6C11.3 20.4 13.4 17.8 15.6 15.6C18.2 13 21 11.1 24 12.6
           C26.5 13.8 29 14.6 31.8 14.2"
        stroke="#0d2f4c" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Dorsal mane: thin flowing strands trailing back over the neck, like
       hair caught in motion; not a jagged crown sitting on top of it. -->
  <path d="M39.5 6.6C34.5 6 29.5 7 25 9" stroke="#e8b84b" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M40.3 8.3C35.3 8.2 30.3 9.2 25.8 11.4" stroke="#d4a017" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M38.6 5C34 4.2 29.6 5 25.6 6.8" stroke="#ffcf6b" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Head: one continuous outline from the neck, up over a modest
       forehead, out along a tapering snout to a real point;
       elongated seahorse-dragon profile instead of a round blob. -->
  <path d="M37 8.8C38.6 6.2 40.3 4.4 42.3 4.2C44.2 4 45.7 5.1 45.4 6.8
           C47.2 7.4 48.9 8.7 49.7 10.4C50 11.2 49.5 11.9 48.7 12
           C47.6 12.7 45.7 12.5 43.8 13.2C41.3 14.2 39.2 15.1 37.5 14.7
           C37.2 12.7 37 10.7 37 8.8Z"
        fill="url(#imugiHead)"/>

  <!-- Nostril + mouth line + a couple of small fangs along the snout. -->
  <circle cx="47.6" cy="9.6" r="0.4" fill="#0d2f4c" opacity="0.6"/>
  <path d="M48.6 11.6C46.6 12.6 44.4 13 42.3 13.7" stroke="#173f66" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M43.3 13.6l0.3 1.5l0.55-1.35M41.5 14l0.3 1.4l0.5-1.25"
        fill="#fff8e6"/>

  <!-- Two horns: sharp, thin blades swept back off the forehead
       (straight-ish edges meeting at a real point reads as a horn; two
       smoothly-rounded curves meeting just looked like a floppy leaf). -->
  <path d="M41.3 5.2Q41.8 2.5 43.6 0.4Q44.3 2.6 44.8 4.3Q43 3.8 41.3 5.2Z" fill="#b8860b"/>
  <path d="M43.6 4.6Q44.1 1.7 46.3 0.15Q46.9 2.4 47.6 4Q45.8 3.5 43.6 4.6Z" fill="#d4a017"/>

  <!-- Brow ridge; angular, gives the eye somewhere to sit instead of
       floating on a round head. -->
  <path d="M40.6 7.2Q42.6 5.6 45.2 6.3" stroke="#b8860b" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Narrow, alert eye (not a big round cute circle); a slit-shaped
       almond with a glowing amber-red iris reads as fierce, not cuddly. -->
  <path d="M41.4 8.9C42.6 8.1 44.1 8.1 45 8.9C43.9 9.6 42.4 9.6 41.4 8.9Z"
        fill="url(#imugiEye)"/>
  <path d="M41.4 8.9C42.6 8.1 44.1 8.1 45 8.9" stroke="#2a0f02" stroke-width="0.32" fill="none" opacity="0.7"/>
  <circle cx="43.9" cy="8.6" r="0.32" fill="#fff" opacity="0.95"/>
  </g>
</svg>
