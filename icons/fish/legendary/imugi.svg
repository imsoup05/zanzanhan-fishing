<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <defs>
    <linearGradient id="imugiBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdd8f"/>
      <stop offset="55%" stop-color="#f0a824"/>
      <stop offset="100%" stop-color="#c9740a"/>
    </linearGradient>
  </defs>

  <!-- Legendary aura -->
  <ellipse cx="26" cy="15" rx="23" ry="16" fill="#ffcf6b" opacity="0.16"/>
  <ellipse cx="30" cy="11" rx="14" ry="10" fill="#ffe9b0" opacity="0.2"/>

  <!-- One continuous body: tapers from a thin tail up through a single
       confident rise, widening the whole way into the neck and head so
       there's no seam where a thin ribbon suddenly meets a round head. -->
  <path d="M2 24C4 19 7 16.5 8 17.5C10 14 12.5 11.5 14 10
           C16 8 18 6.3 20 5.6C23 4.8 25.3 4.7 27 4.8
           C30 5 32.5 5.4 34 6.2C37 7.5 38.8 7.8 40 8.4
           C41.5 5.5 43 2.6 44.5 2.5C47 2.4 49 8 49.5 13
           C49 15.5 47.5 18.5 45 19.5C43 22 41.5 20.5 40 17.6
           C38 16.8 35.5 15 34 14C32 12.6 30 11.5 27 11.3
           C25 11.2 23 11 20 10.6C18 10.3 16 13.5 14 14.3
           C12.5 15 10 17.5 8 20.5C6.5 22.5 4 23 2 24Z"
        fill="url(#imugiBody)"/>

  <!-- Spine highlight along the top edge. -->
  <path d="M8.3 16.9C11 13.6 13 11.3 14.3 9.8C16.4 7.6 18.6 5.9 20.5 5.1
           C23.2 4.3 25.5 4.2 27.3 4.3"
        stroke="#fff0cf" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Mane spikes along the back of the neck. -->
  <path d="M31 6.4l1.1-3l0.9 2.8M35.5 7.8l1.1-2.9l0.9 2.7" fill="#c9740a"/>

  <!-- Whiskers streaming back from the snout, over the neck. -->
  <path d="M46 9C41 7.4 35 8 29.5 10.2" stroke="#a85f08" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M46.6 12.4C41.6 13 36 14.6 29.8 14.6" stroke="#ffe9b0" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Jaw line + a couple of small teeth. -->
  <path d="M48.7 11.8C49 14 47.9 16.6 45.6 18.4" stroke="#a85f08" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M44.6 18.3l0.55 1.5l0.65-1.4M42.3 19.3l0.55 1.5l0.65-1.4" stroke="#fff8e6" stroke-width="0.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two horns off the crown, swept well back. -->
  <path d="M43.4 3.4C43.1 1.9 43.7 0.6 45.4 0.1C45.3 1.2 45.9 2.2 47 3
           C45.7 2.7 44.4 2.9 43.4 3.4Z" fill="#8a4e06"/>
  <path d="M45.7 2.7C45.6 1.2 46.4 0 48 -0.4C47.9 0.6 48.4 1.6 49.4 2.3
           C48.1 2 46.8 2.2 45.7 2.7Z" fill="#a85f08"/>

  <!-- Brow + big expressive eye. -->
  <path d="M42.6 5.4q2.6-1.7 5.2-0.6" stroke="#a85f08" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="45.9" cy="7.6" r="1.7" fill="#241405"/>
  <circle cx="46.4" cy="7.05" r="0.52" fill="#fff" opacity="0.95"/>
</svg>
