<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>잔잔한 낚시터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14586b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="낚시터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="bg-canvas"></canvas>

  <header class="topbar">
    <div class="topbar-row1">
      <h1 class="title">🌤️ 잔잔한 낚시터</h1>
      <div id="shells-display" class="shells-pill">🐚 <span id="shells-count">0</span></div>
    </div>
    <div class="topbar-btns">
      <button id="settings-btn" class="icon-btn icon-only" title="설정">
        <span class="topbar-icon">⚙️</span><span class="topbar-label">설정</span>
      </button>
      <button id="bucket-btn" class="icon-btn icon-only" title="보관함">
        <span class="topbar-icon">🧺<span id="log-new-dot" class="new-dot hidden"></span></span><span class="topbar-label">보관함</span>
      </button>
      <button id="shop-btn" class="icon-btn icon-only" title="바다사자상점">
        <span class="topbar-icon">🏪</span><span class="topbar-label">상점</span>
      </button>
    </div>
  </header>

  <div id="toast" class="toast"></div>

  <!-- Auto-skip catch flourish (non-blocking, replaces the plain toast) -->
  <div id="auto-catch-popup" class="auto-catch-popup">
    <div id="auto-catch-icon" class="auto-catch-icon"></div>
    <div class="auto-catch-info">
      <div class="auto-catch-name-row">
        <span id="auto-catch-tier" class="tier-badge"></span>
        <span id="auto-catch-name" class="auto-catch-name"></span>
      </div>
      <div id="auto-catch-meta" class="auto-catch-meta"></div>
      <div id="auto-catch-material" class="auto-catch-material hidden"></div>
    </div>
  </div>

  <!-- Idle / cast prompt -->
  <div id="idle-panel" class="bottom-panel">
    <button id="bait-toggle-btn" class="bait-toggle-btn">
      <span id="bait-toggle-label">🪱 기본 미끼</span>
      <span id="bait-toggle-chevron" class="bait-toggle-chevron">▾</span>
    </button>
    <div id="bait-selector" class="bait-selector collapsed">
      <button class="bait-btn selected" data-bait="basic">기본<span class="bait-count"></span></button>
      <button class="bait-btn hidden" data-bait="mid">중급<span class="bait-count">x0</span></button>
      <button class="bait-btn hidden" data-bait="high">고급<span class="bait-count">x0</span></button>
      <button class="bait-btn hidden" data-bait="super">특급<span class="bait-count">x0</span></button>
      <button class="bait-btn hidden" data-bait="legend">전설<span class="bait-count">x0</span></button>
    </div>
    <p id="bait-info-text" class="hint-text small bait-info-text"></p>
    <p id="idle-text" class="hint-text">다리 밑, 잔잔한 물결 위로 낚싯대를 드리워보세요.</p>
    <button id="cast-btn" class="main-btn">🎣 낚싯대 던지기</button>
  </div>

  <!-- Waiting for bite -->
  <div id="waiting-panel" class="bottom-panel hidden">
    <p class="hint-text">고요한 수면 아래... 입질을 기다리는 중</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Bite window (auto-advances, no input needed) -->
  <div id="bite-panel" class="bottom-panel hidden">
    <p class="hint-text bite-text">⚡ 입질이 왔어요!</p>
  </div>

  <!-- Reeling minigame -->
  <div id="reel-panel" class="bottom-panel hidden">
    <div class="reel-header">
      <span id="fish-name" class="fish-name">???</span>
      <span id="fish-tier-badge" class="tier-badge"></span>
      <div id="miss-hearts" class="miss-hearts"></div>
    </div>
    <p class="hint-text small">파란 구간에 흰 막대가 들어왔을 때 눌러주세요</p>
    <div class="time-track"><div id="time-fill" class="time-fill"></div></div>
    <div class="gauge-track" id="gauge-track">
      <div id="gauge-zone" class="gauge-zone"></div>
      <div id="gauge-indicator" class="gauge-indicator"></div>
    </div>
    <div id="hit-dots" class="hit-dots"></div>
  </div>

  <!-- Result popup -->
  <div id="result-overlay" class="overlay hidden">
    <div id="result-card" class="result-card">
      <div id="splash-flash" class="splash-flash"></div>
      <div id="new-badge" class="new-badge hidden">NEW!</div>
      <div id="material-badge" class="material-badge hidden"></div>
      <div id="result-icon" class="result-icon"></div>
      <span id="result-tier-badge" class="tier-badge hidden"></span>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-desc" class="result-desc"></p>
      <button id="result-btn" class="main-btn">계속하기</button>
    </div>
  </div>

  <!-- Container: 대야 / 양동이 / 어항, with 도감 folded in as a second sub-tab -->
  <div id="bucket-overlay" class="overlay hidden">
    <div class="log-card">
      <div class="log-card-head">
        <h2><span id="bucket-tier-name">🪣 대야</span> <span id="bucket-capacity" class="bucket-capacity"></span></h2>
        <button id="bucket-close" class="icon-btn">✕</button>
      </div>
      <div class="sub-tabs">
        <button id="bucket-subtab-inventory" class="sub-tab active">보관함</button>
        <button id="bucket-subtab-log" class="sub-tab">도감</button>
      </div>
      <div id="bucket-view" class="subtab-view">
        <div id="bucket-list" class="log-list"></div>
      </div>
      <div id="log-view" class="subtab-view hidden">
        <div id="log-list" class="log-list"></div>
        <p class="log-total" id="log-total"></p>
      </div>
    </div>
  </div>

  <!-- Shop: 바다사자상점 (판매 / 강화 / 뽑기 3개 탭) -->
  <div id="shop-overlay" class="overlay hidden">
    <div class="log-card shop-card">
      <div class="log-card-head">
        <h2>🦭 바다사자상점</h2>
        <button id="shop-close" class="icon-btn">✕</button>
      </div>
      <p class="shop-shells">보유 조개: 🐚 <span id="shop-shells">0</span></p>
      <div class="sub-tabs">
        <button id="shop-subtab-sell" class="sub-tab active">판매</button>
        <button id="shop-subtab-upgrade" class="sub-tab">강화</button>
        <button id="shop-subtab-gacha" class="sub-tab">뽑기</button>
      </div>

      <div id="shop-view-sell" class="subtab-view">
        <div id="shop-sell-list" class="log-list shop-sell-list"></div>
      </div>

      <div id="shop-view-upgrade" class="subtab-view hidden">
        <h3 class="shop-section-title">🪝 낚싯대</h3>
        <div class="rod-panel">
          <div class="rod-stat-row">
            <span id="rod-grade-label" class="rod-grade-label"></span>
            <span id="rod-level-label" class="rod-level-label"></span>
          </div>
          <p id="rod-power-label" class="rod-power-label"></p>
          <button id="rod-levelup-btn" class="main-btn small"></button>

          <div class="rod-divider"></div>
          <p id="rod-gradeup-info" class="hint-text small"></p>
          <button id="rod-gradeup-btn" class="main-btn small"></button>

          <div class="rod-divider"></div>
          <label class="skip-toggle-row">
            <span>저등급 물고기 자동 스킵</span>
            <input type="checkbox" id="skip-toggle">
            <span class="toggle-switch"></span>
          </label>
          <p id="skip-info" class="hint-text small"></p>
        </div>

        <h3 class="shop-section-title">🧺 보관함</h3>
        <p id="shop-container-info" class="hint-text small"></p>
        <button id="shop-container-btn" class="main-btn small"></button>
      </div>

      <div id="shop-view-gacha" class="subtab-view hidden">
        <h3 class="shop-section-title">🎰 미끼 뽑기</h3>
        <p class="hint-text small">미끼는 더 이상 직접 구매할 수 없고, 이 뽑기로만 얻을 수 있어요.</p>
        <div id="roulette-odds" class="roulette-odds"></div>
        <div class="roulette-btn-row">
          <button id="roulette-pull1-btn" class="main-btn small"></button>
          <button id="roulette-pull11-btn" class="main-btn small"></button>
        </div>
        <div id="roulette-result" class="roulette-result hidden"></div>
      </div>
    </div>
  </div>

  <!-- 설정: 배경음악 on/off + 볼륨 -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="log-card">
      <div class="log-card-head">
        <h2>⚙️ 설정</h2>
        <button id="settings-close" class="icon-btn">✕</button>
      </div>
      <div class="settings-row">
        <span>배경음악</span>
        <button id="settings-bgm-toggle" class="main-btn small"></button>
      </div>
      <div class="settings-row settings-row-volume">
        <span>음악 볼륨</span>
        <input type="range" id="settings-bgm-volume" min="0" max="100" value="80">
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is a nice-to-have, not required */ });
    });
  }
</script>
</body>
</html>
