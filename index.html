<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>잔잔한 낚시터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0f4b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="낚시터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="bg-canvas"></canvas>

  <!-- Reserved zones (see 기본 UI 영역 분류): tapping here never casts a line -->
  <header class="topbar">
    <div class="location-pill"><img class="ui-icon" src="icons/location.svg" alt="">다리 밑</div>
    <div class="topbar-right">
      <div class="shells-pill"><img class="ui-icon" src="icons/shell.svg" alt=""> <span id="shells-count">0</span></div>
      <button id="menu-toggle-btn" class="icon-btn" title="메뉴"><img class="ui-icon-lg" src="icons/menu.svg" alt="메뉴"></button>

      <!-- Grows straight down out of the hamburger button, same width and
           color, so it reads as one shape rather than a separate panel.
           Icon-only. Order: 상점, 보관함, 설정. -->
      <nav id="side-menu" class="side-menu">
        <button id="menu-shop-btn" class="side-menu-item" title="상점">
          <img class="side-menu-icon" src="icons/shop.svg" alt="상점">
        </button>
        <button id="menu-bucket-btn" class="side-menu-item" title="보관함">
          <img class="side-menu-icon" src="icons/bucket.svg" alt="보관함">
        </button>
        <button id="menu-settings-btn" class="side-menu-item" title="설정">
          <img class="side-menu-icon" src="icons/settings.svg" alt="설정">
        </button>
      </nav>
    </div>
  </header>

  <p id="status-text" class="status-text hidden"></p>

  <!-- Reeling gauge: vertical, left side, thumb sweeps top-bottom.
       Left-to-right: position gauge, per-hit time limit, then fish (hits)
       + chances (misses) stacked together in one column. -->
  <div id="reel-gauge" class="reel-gauge hidden">
    <div id="gauge-track-v" class="gauge-track-v">
      <div id="gauge-zone-v" class="gauge-zone-v"></div>
      <div id="gauge-indicator-v" class="gauge-indicator-v"></div>
    </div>
    <div id="time-track-v" class="time-track-v">
      <div id="time-fill-v" class="time-fill-v"></div>
    </div>
    <div class="status-column">
      <div id="hits-counter-v" class="hits-counter-v"></div>
      <!-- Traffic-light shaped housing, but the lights are just blue
           "chances remaining" -- not a red/yellow/green severity meter.
           Dot count follows reel.maxMisses (min/max may vary later). -->
      <div id="chance-lights" class="chance-lights"></div>
    </div>
  </div>

  <footer class="bottombar">
    <button id="bait-btn" class="bait-btn-main" title="미끼"><img class="ui-icon-xl" src="icons/bait.svg" alt="미끼"></button>
  </footer>

  <!-- Invisible click-outside-to-close catcher for the slide-out menu. -->
  <div id="menu-backdrop" class="menu-backdrop"></div>

  <!-- Shop popup: opened from the side menu's 상점 button. Fixed size
       (proportional to the screen, not to its content) so switching tabs
       never resizes the panel. -->
  <div id="shop-overlay" class="overlay hidden">
    <div id="shop-panel" class="shop-panel">
      <div class="shop-header">
        <h2 class="shop-title">상점</h2>
        <button id="shop-close-btn" class="shop-close-btn" title="닫기">
          <img class="shop-close-icon" src="icons/close.svg" alt="닫기">
        </button>
      </div>
      <nav class="shop-tabs">
        <button class="shop-tab active" data-tab="buy">구매</button>
        <button class="shop-tab" data-tab="sell">판매</button>
        <button class="shop-tab" data-tab="upgrade">업그레이드</button>
      </nav>
      <div class="shop-body">
        <div id="shop-tab-buy" class="shop-tab-panel">
          <p class="shop-placeholder">구매 기능은 아직 준비 중이에요.</p>
        </div>
        <div id="shop-tab-sell" class="shop-tab-panel hidden">
          <div id="sell-list" class="sell-list"></div>
          <p id="sell-empty" class="shop-placeholder hidden">아직 잡아서 보관 중인 물고기가 없어요.</p>
        </div>
        <div id="shop-tab-upgrade" class="shop-tab-panel hidden">
          <div class="upgrade-rod">
            <div id="upgrade-rod-icon" class="upgrade-rod-icon">
              <img src="icons/rod.svg" alt="">
            </div>
            <div class="upgrade-rod-info">
              <div id="rod-name" class="upgrade-rod-name"></div>
              <div id="rod-level" class="upgrade-rod-level"></div>
              <div class="upgrade-bar-track"><div id="upgrade-bar-fill" class="upgrade-bar-fill"></div></div>
            </div>
            <button id="rod-upgrade-btn" class="upgrade-btn">강화</button>
          </div>
          <p id="rod-max-note" class="upgrade-max-note hidden"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Result popup: same look as the old version's catch/miss card -->
  <div id="result-overlay" class="overlay hidden">
    <div id="result-card" class="result-card">
      <div id="splash-flash" class="splash-flash"></div>
      <div id="new-badge" class="new-badge hidden">NEW!</div>
      <div id="result-icon" class="result-icon"></div>
      <span id="result-tier-badge" class="tier-badge hidden"></span>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-desc" class="result-desc"></p>
      <button id="result-btn" class="main-btn">계속하기</button>
    </div>
  </div>
</div>
<script src="fish-data.js"></script>
<script src="game.js"></script>
<script src="dev-mode.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is a nice-to-have, not required */ });
    });
  }
</script>
</body>
</html>
